# ENV-07: тесты на каждый push (GitHub Actions). Для GitLab/GitVerse — перенести шаги в их CI.
name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy opencv-python-headless matplotlib zxing-cpp python-barcode pillow pyyaml
      - run: cd core && python -m unittest discover -s tests -v
      - run: |
          for d in sim/tests tools/tests research/tests; do
            [ -d "$d" ] && python -m unittest discover -s "$d" -t . -v
          done
      - run: python -m unittest discover -s ros2_ws/tests -v
