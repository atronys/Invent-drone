<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 624" width="724" height="624" font-family="Arial, sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0.8 L9,3.5 L0,6.2 z"/></marker><marker id="arr0" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto"><path d="M9,0.8 L0,3.5 L9,6.2 z"/></marker></defs><rect x="192.0" y="192.0" width="340.0" height="224.0" rx="12.0" fill="none" stroke="#000" stroke-width="2"/><circle cx="206.0" cy="402.0" r="5.4" fill="none" stroke="#000" stroke-width="1.4"/><circle cx="438.0" cy="402.0" r="5.4" fill="none" stroke="#000" stroke-width="1.4"/><circle cx="206.0" cy="206.0" r="5.4" fill="none" stroke="#000" stroke-width="1.4"/><circle cx="438.0" cy="206.0" r="5.4" fill="none" stroke="#000" stroke-width="1.4"/><rect x="220.0" y="196.0" width="204.0" height="20.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><text x="322.0" y="210.8" font-size="9" text-anchor="middle">GPIO, 40 выводов (не используется)</text><rect x="218.8" y="392.0" width="36.0" height="30.0" rx="0.0" fill="#ddd" stroke="#000" stroke-width="1.4"/><rect x="281.2" y="394.0" width="28.0" height="28.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><rect x="334.8" y="394.0" width="28.0" height="28.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><rect x="376.8" y="356.0" width="10.4" height="48.0" rx="0.0" fill="#ddd" stroke="#000" stroke-width="1.4"/><rect x="400.8" y="356.0" width="10.4" height="48.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><rect x="458.0" y="342.0" width="86.0" height="66.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><rect x="472.0" y="272.0" width="72.0" height="54.0" rx="0.0" fill="#ddd" stroke="#000" stroke-width="1.4"/><rect x="472.0" y="200.8" width="72.0" height="54.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><rect x="434.0" y="218.0" width="22.0" height="16.0" rx="0.0" fill="#ddd" stroke="#000" stroke-width="1.4"/><rect x="186.0" y="268.0" width="14.0" height="52.0" rx="0.0" fill="none" stroke="#000" stroke-width="1"/><rect x="280.0" y="248.0" width="88.0" height="88.0" rx="0.0" fill="none" stroke="#000" stroke-width="0.8"/><text x="324.0" y="296.0" font-size="9" text-anchor="middle">процессор</text><text x="324.0" y="310.0" font-size="8.5" text-anchor="middle">(под охладителем)</text><line x1="236.8" y1="420.0" x2="200.0" y2="460.0" stroke="#000" stroke-width="0.7"/><text x="200.0" y="476.0" font-size="10.5" text-anchor="middle">1. Питание: блок G1,</text><text x="200.0" y="492.0" font-size="10.5" text-anchor="middle">USB-C 5,1 В / 5 А</text><line x1="382.0" y1="404.0" x2="400.0" y2="460.0" stroke="#000" stroke-width="0.7"/><text x="400.0" y="476.0" font-size="10.5" text-anchor="middle">2. Камера A5: шлейф,</text><text x="400.0" y="492.0" font-size="10.5" text-anchor="middle">CAM/DISP (любой из двух)</text><line x1="544.0" y1="300.0" x2="560.0" y2="296.0" stroke="#000" stroke-width="0.7"/><text x="560.0" y="270.0" font-size="10.5" text-anchor="start">3. Сенсорная головка A2:</text><text x="560.0" y="286.0" font-size="10.5" text-anchor="start">кабель USB (любой порт)</text><line x1="544.0" y1="376.0" x2="560.0" y2="372.0" stroke="#000" stroke-width="0.7"/><text x="560.0" y="346.0" font-size="10.5" text-anchor="start">4. Сеть: Ethernet</text><text x="560.0" y="362.0" font-size="10.5" text-anchor="start">или Wi-Fi</text><line x1="444.0" y1="218.0" x2="472.0" y2="172.0" stroke="#000" stroke-width="0.7"/><text x="472.0" y="146.0" font-size="10.5" text-anchor="middle">5. Вентилятор</text><text x="472.0" y="162.0" font-size="10.5" text-anchor="middle">охладителя</text><line x1="295.2" y1="422.0" x2="288.0" y2="520.0" stroke="#000" stroke-width="0.7"/><text x="288.0" y="536.0" font-size="10.5" text-anchor="middle">micro-HDMI — только для первичной</text><text x="288.0" y="552.0" font-size="10.5" text-anchor="middle">настройки с монитором</text><line x1="186.0" y1="296.0" x2="104.0" y2="260.0" stroke="#000" stroke-width="0.7"/><text x="104.0" y="234.0" font-size="10.5" text-anchor="middle">PCIe —</text><text x="104.0" y="250.0" font-size="10.5" text-anchor="middle">не используется</text><text x="272.0" y="128.0" font-size="10.5" text-anchor="middle">Карта microSD — снизу платы,</text><text x="272.0" y="144.0" font-size="10.5" text-anchor="middle">с края, противоположного USB</text><text x="362.0" y="576.0" font-size="10" text-anchor="middle">Серым выделены разъёмы, занятые в стенде. Положение разъёмов CAM/DISP,</text><text x="362.0" y="592.0" font-size="10" text-anchor="middle">Ethernet и USB — по чертежу платы, приблизительно.</text></svg>
